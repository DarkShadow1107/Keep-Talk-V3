# ===== DRÄHTE-MODUL =====
WIRES_DESC=Die Drähte sind horizontal angeordnet. Schneiden Sie den richtigen Draht, um zu entschärfen.
WIRES_RULE=Schneiden Sie immer den letzten Draht.
WIRES_NOTE=<b>Hinweis:</b> Das Modul zeigt 3 bis 6 farbige Drähte. Zählen Sie von oben (1) nach unten (6). Der richtige Draht ist immer der letzte.

# ===== KNOPF-MODUL =====
BTN_STEP1=Schritt 1: Feststellen, ob Tippen oder Halten
BTN_STEP2=Schritt 2: Einen gehaltenen Knopf loslassen
BTN_FOLLOW_RULES=Befolgen Sie diese Regeln <b>der Reihe nach</b>. Stoppen Sie bei der ersten zutreffenden Regel:
BTN_BLUE_ABORT=Wenn der Knopf <b>Blau</b> ist und <b>Abbruch</b> sagt, <span class='highlight'>Halten</span> Sie ihn.
BTN_DETONATE=Wenn es mehr als 1 Batterie gibt und der Knopf <b>Zünden</b> sagt, <span class='highlight'>Tippen</span> Sie ihn.
BTN_WHITE_CAR=Wenn der Knopf <b>Weiß</b> ist und ein leuchtender Indikator <b>CAR</b> vorhanden ist, <span class='highlight'>Halten</span> Sie ihn.
BTN_FRK=Wenn es mehr als 2 Batterien und einen leuchtenden Indikator <b>FRK</b> gibt, <span class='highlight'>Tippen</span> Sie ihn.
BTN_YELLOW=Wenn der Knopf <b>Gelb</b> ist, <span class='highlight'>Halten</span> Sie ihn.
BTN_RED_HOLD=Wenn der Knopf <b>Rot</b> ist und <b>Halten</b> sagt, <span class='highlight'>Tippen</span> Sie ihn.
BTN_OTHERWISE=Andernfalls <span class='highlight'>Halten</span> Sie ihn.
BTN_STRIP_INFO=Wenn Sie den Knopf halten, leuchtet ein farbiger Streifen auf. Lassen Sie los, wenn der Timer die entsprechende Ziffer enthält:
BTN_STRIP_BLUE=Blauer Streifen:
BTN_STRIP_WHITE=Weißer Streifen:
BTN_STRIP_YELLOW=Gelber Streifen:
BTN_STRIP_OTHER=Jede andere Farbe:
BTN_STRIP_HEADER_COLOR=Streifenfarbe
BTN_STRIP_HEADER_RELEASE=Loslassen wenn Timer enthält:

# ===== TASTENFELD-MODUL =====
KEYPAD_DESC=Das Tastenfeld zeigt 4 Symbole. Drücken Sie sie in <span class='highlight'>alphabetischer Reihenfolge</span> basierend auf ihren Unicode-Werten.
KEYPAD_TIP=<b>Tipp:</b> Vergleichen Sie die Symbole visuell - griechische Buchstaben (Ω, Ψ, Φ) kommen vor kyrillischen Buchstaben, die vor Sonderzeichen kommen.

# ===== SIMON SAGT-MODUL =====
SIMON_DESC=Beobachten Sie die blinkenden farbigen Lichter. Drücken Sie die Tasten in der richtigen Reihenfolge basierend auf der Seriennummer und den Fehlern.
SIMON_SERIAL_CHECK=<b>Prüfen Sie die SERIENNUMMER:</b> Enthält sie einen Vokal (A, E, I, O, U)?
SIMON_WITH_VOWEL=Seriennummer MIT Vokal
SIMON_WITHOUT_VOWEL=Seriennummer OHNE Vokal
SIMON_FLASH=Blitz
SIMON_0_STRIKES=0 Fehler
SIMON_1_STRIKE=1 Fehler
SIMON_2_STRIKES=2+ Fehler
SIMON_COMPLETE=<b>Schließen Sie 3 Stufen ab</b>, um das Modul zu lösen. Jede Stufe fügt eine weitere Farbe hinzu.

# ===== LABYRINTH-MODUL =====
MAZE_DESC1=Navigieren Sie das <b>weiße Dreieck</b> (Sie) zum <b>roten Kreis</b> (Ziel).
MAZE_DESC2=Verwenden Sie <span class='highlight'>WASD</span> oder die <span class='highlight'>Pfeiltasten</span> zum Bewegen.
MAZE_WALLS=<b>Wände sind sichtbar</b> als dunkelgrüne Blöcke. Das Bewegen gegen eine Wand verursacht einen FEHLER!
MAZE_BUTTONS=Sie können auch auf die Richtungstasten unter dem Labyrinth klicken.

