# ===== KABLAR MODUL =====
WIRES_DESC=Kablar är arrangerade horisontellt. Klipp rätt kabel för att desarmera.
WIRES_RULE=Klipp alltid den sista kabeln.
WIRES_NOTE=<b>Obs:</b> Modulen visar 3 till 6 färgade kablar. Räkna från toppen (1) till botten (6). Rätt kabel att klippa är alltid den sista i sekvensen.

# ===== KNAPP MODUL =====
BTN_STEP1=Steg 1: Bestäm om du ska Trycka eller Hålla
BTN_STEP2=Steg 2: Släppa en Hållen Knapp
BTN_FOLLOW_RULES=Följ dessa regler <b>i ordning</b>. Stanna vid den första regeln som gäller:
BTN_BLUE_ABORT=Om knappen är <b>Blå</b> och säger <b>Avbryt</b>, <span class='highlight'>Håll</span> den.
BTN_DETONATE=Om det finns mer än 1 batteri och knappen säger <b>Detonera</b>, <span class='highlight'>Tryck</span> på den.
BTN_WHITE_CAR=Om knappen är <b>Vit</b> och det finns en tänd indikator <b>CAR</b>, <span class='highlight'>Håll</span> den.
BTN_FRK=Om det finns mer än 2 batterier och en tänd indikator <b>FRK</b>, <span class='highlight'>Tryck</span> på den.
BTN_YELLOW=Om knappen är <b>Gul</b>, <span class='highlight'>Håll</span> den.
BTN_RED_HOLD=Om knappen är <b>Röd</b> och säger <b>Håll</b>, <span class='highlight'>Tryck</span> på den.
BTN_OTHERWISE=Annars, <span class='highlight'>Håll</span> den.
BTN_STRIP_INFO=Om du håller knappen, kommer en färgad rand att lysa. Släpp knappen när timern innehåller motsvarande siffra:
BTN_STRIP_BLUE=Blå Rand:
BTN_STRIP_WHITE=Vit Rand:
BTN_STRIP_YELLOW=Gul Rand:
BTN_STRIP_OTHER=Vilken annan färg som helst:
BTN_STRIP_HEADER_COLOR=Randfärg
BTN_STRIP_HEADER_RELEASE=Släpp när timern innehåller:

