# ===== MODUL BUTON =====
BTN_STEP1=Pasul 1: Determină dacă să Atingi sau Menții
BTN_STEP2=Pasul 2: Eliberarea unui Buton Menținut
BTN_FOLLOW_RULES=Urmează aceste reguli <b>în ordine</b>. Oprește-te la prima regulă aplicabilă:
BTN_BLUE_ABORT=Dacă butonul este <b>Albastru</b> și spune <b>Abandon</b>, <span class='highlight'>Menține</span>-l.
BTN_DETONATE=Dacă sunt mai mult de 1 baterie și butonul spune <b>Detonează</b>, <span class='highlight'>Atinge</span>-l.
BTN_WHITE_CAR=Dacă butonul este <b>Alb</b> și există un indicator aprins <b>CAR</b>, <span class='highlight'>Menține</span>-l.
BTN_FRK=Dacă sunt mai mult de 2 baterii și un indicator aprins <b>FRK</b>, <span class='highlight'>Atinge</span>-l.
BTN_YELLOW=Dacă butonul este <b>Galben</b>, <span class='highlight'>Menține</span>-l.
BTN_RED_HOLD=Dacă butonul este <b>Roșu</b> și spune <b>Menține</b>, <span class='highlight'>Atinge</span>-l.
BTN_OTHERWISE=Altfel, <span class='highlight'>Menține</span>-l.
