MORSE_WORD=Słowo
MORSE_FREQUENCY=Częstotliwość

# ===== MODUŁ SKOMPLIKOWANE PRZEWODY =====
COMPWIRES_DESC=Każdy przewód może mieć: kolor <b>Czerwony</b>, kolor <b>Niebieski</b>, symbol <b>★ Gwiazda</b>, i świecącą <b>diodę LED</b>.
COMPWIRES_TABLE_INFO=Użyj tej tabeli - X oznacza, że cecha jest obecna:
COMPWIRES_RED=Czerwony
COMPWIRES_BLUE=Niebieski
COMPWIRES_STAR=Gwiazda
COMPWIRES_LED=LED
COMPWIRES_ACTION=Akcja
COMPWIRES_CUT=PRZETNIJ
