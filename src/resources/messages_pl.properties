# ===== MODUŁ PRZEWODY =====
WIRES_DESC=Przewody są ułożone poziomo. Przetnij właściwy przewód, aby rozbroić.
WIRES_RULE=Zawsze przetnij ostatni przewód.
WIRES_NOTE=<b>Uwaga:</b> Moduł wyświetla od 3 do 6 kolorowych przewodów. Licz od góry (1) do dołu (6). Właściwy przewód do przetnięcia to zawsze ostatni w sekwencji.

# ===== MODUŁ PRZYCISK =====
BTN_STEP1=Krok 1: Określ, czy Stuknąć czy Przytrzymać
BTN_STEP2=Krok 2: Zwalnianie Przytrzymanego Przycisku
BTN_FOLLOW_RULES=Postępuj według tych zasad <b>po kolei</b>. Zatrzymaj się przy pierwszej zasadzie, która ma zastosowanie:
BTN_BLUE_ABORT=Jeśli przycisk jest <b>Niebieski</b> i mówi <b>Przerwij</b>, <span class='highlight'>Przytrzymaj</span> go.
BTN_DETONATE=Jeśli jest więcej niż 1 bateria i przycisk mówi <b>Zdetonuj</b>, <span class='highlight'>Stuknij</span> go.
BTN_WHITE_CAR=Jeśli przycisk jest <b>Biały</b> i jest świecący wskaźnik <b>CAR</b>, <span class='highlight'>Przytrzymaj</span> go.
BTN_FRK=Jeśli są więcej niż 2 baterie i świecący wskaźnik <b>FRK</b>, <span class='highlight'>Stuknij</span> go.
BTN_YELLOW=Jeśli przycisk jest <b>Żółty</b>, <span class='highlight'>Przytrzymaj</span> go.
BTN_RED_HOLD=Jeśli przycisk jest <b>Czerwony</b> i mówi <b>Przytrzymaj</b>, <span class='highlight'>Stuknij</span> go.
BTN_OTHERWISE=W przeciwnym razie, <span class='highlight'>Przytrzymaj</span> go.
BTN_STRIP_INFO=Jeśli przytrzymasz przycisk, zaświeci się kolorowy pasek. Zwolnij przycisk, gdy timer zawiera odpowiednią cyfrę:
BTN_STRIP_BLUE=Niebieski Pasek:
BTN_STRIP_WHITE=Biały Pasek:
BTN_STRIP_YELLOW=Żółty Pasek:
BTN_STRIP_OTHER=Jakikolwiek inny kolor:
BTN_STRIP_HEADER_COLOR=Kolor Paska
BTN_STRIP_HEADER_RELEASE=Zwolnij gdy timer zawiera:

# ===== MODUŁ KLAWIATURA =====
KEYPAD_DESC=Klawiatura wyświetla 4 symbole. Naciśnij je w <span class='highlight'>kolejności alfabetycznej</span> na podstawie ich wartości znaków Unicode.
KEYPAD_TIP=<b>Wskazówka:</b> Porównaj symbole wizualnie - litery greckie (Ω, Ψ, Φ) są przed cyrylicą, która jest przed symbolami specjalnymi.

# ===== MODUŁ SIMON MÓWI =====
SIMON_DESC=Obserwuj migające kolorowe światła. Naciskaj przyciski we właściwej kolejności na podstawie numeru seryjnego i aktualnych błędów.
SIMON_SERIAL_CHECK=<b>Sprawdź NUMER SERYJNY:</b> Czy zawiera samogłoskę (A, E, I, O, U)?
SIMON_WITH_VOWEL=Numer Seryjny Z Samogłoską
SIMON_WITHOUT_VOWEL=Numer Seryjny BEZ Samogłoski
SIMON_FLASH=Błysk
SIMON_0_STRIKES=0 Błędów
SIMON_1_STRIKE=1 Błąd
SIMON_2_STRIKES=2+ Błędy
SIMON_COMPLETE=<b>Ukończ 3 etapy</b>, aby rozwiązać moduł. Każdy etap dodaje kolejny kolor do zapamiętania.

# ===== MODUŁ LABIRYNT =====
MAZE_DESC1=Nawiguj <b>biały trójkąt</b> (ty) do <b>czerwonego koła</b> (cel).
MAZE_DESC2=Użyj <span class='highlight'>WASD</span> lub <span class='highlight'>Klawiszy Strzałek</span> do poruszania się.
MAZE_WALLS=<b>Ściany są widoczne</b> jako ciemnozielone bloki. Wejście w ścianę powoduje BŁĄD!
MAZE_BUTTONS=Możesz też kliknąć przyciski kierunkowe pod labiryntem.

