COMPWIRES_CUT_IF_PARALLEL=Przetnij jeśli Port Równoległy
COMPWIRES_CUT_IF_EVEN=Przetnij jeśli Nr Seryjny kończy się Parzyście
COMPWIRES_CUT_IF_BATTERIES=Przetnij jeśli Baterie ≥ 2
COMPWIRES_FINAL=<b>Przetnij wszystkie przewody, które trzeba przetnąć</b>, aby rozbroić moduł.

# ===== MODUŁ HASŁO =====
