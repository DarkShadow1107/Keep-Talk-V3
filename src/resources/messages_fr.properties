# ===== MODULE FILS =====
WIRES_DESC=Les fils sont disposés horizontalement. Coupez le bon fil pour désamorcer.
WIRES_RULE=Coupez toujours le dernier fil.
WIRES_NOTE=<b>Note:</b> Le module affiche de 3 à 6 fils colorés. Comptez du haut (1) vers le bas (6). Le fil correct à couper est toujours le dernier de la séquence.

# ===== MODULE BOUTON =====
BTN_STEP1=Étape 1: Déterminer s'il faut Appuyer ou Maintenir
BTN_STEP2=Étape 2: Relâcher un Bouton Maintenu
BTN_FOLLOW_RULES=Suivez ces règles <b>dans l'ordre</b>. Arrêtez-vous à la première règle applicable:
BTN_BLUE_ABORT=Si le bouton est <b>Bleu</b> et dit <b>Abandon</b>, <span class='highlight'>Maintenez</span>-le.
BTN_DETONATE=S'il y a plus d'1 pile et le bouton dit <b>Détoner</b>, <span class='highlight'>Appuyez</span> dessus.
BTN_WHITE_CAR=Si le bouton est <b>Blanc</b> et il y a un indicateur allumé <b>CAR</b>, <span class='highlight'>Maintenez</span>-le.
BTN_FRK=S'il y a plus de 2 piles et un indicateur allumé <b>FRK</b>, <span class='highlight'>Appuyez</span> dessus.
BTN_YELLOW=Si le bouton est <b>Jaune</b>, <span class='highlight'>Maintenez</span>-le.
BTN_RED_HOLD=Si le bouton est <b>Rouge</b> et dit <b>Maintenir</b>, <span class='highlight'>Appuyez</span> dessus.
BTN_OTHERWISE=Sinon, <span class='highlight'>Maintenez</span>-le.
BTN_STRIP_INFO=Si vous maintenez le bouton, une bande colorée s'allumera. Relâchez le bouton lorsque le minuteur contient le chiffre correspondant:
BTN_STRIP_BLUE=Bande Bleue:
BTN_STRIP_WHITE=Bande Blanche:
BTN_STRIP_YELLOW=Bande Jaune:
BTN_STRIP_OTHER=Toute autre couleur:
BTN_STRIP_HEADER_COLOR=Couleur de la Bande
BTN_STRIP_HEADER_RELEASE=Relâcher quand le minuteur contient:

# ===== MODULE CLAVIER =====
KEYPAD_DESC=Le clavier affiche 4 symboles. Appuyez dessus dans <span class='highlight'>l'ordre alphabétique</span> basé sur leurs valeurs Unicode.
KEYPAD_TIP=<b>Astuce:</b> Comparez les symboles visuellement - les lettres grecques (Ω, Ψ, Φ) viennent avant les lettres cyrilliques, qui viennent avant les symboles spéciaux.

# ===== MODULE SIMON DIT =====
SIMON_DESC=Observez les lumières colorées clignoter. Appuyez sur les boutons dans le bon ordre basé sur le numéro de série et les erreurs actuelles.
SIMON_SERIAL_CHECK=<b>Vérifiez le NUMÉRO DE SÉRIE:</b> Contient-il une voyelle (A, E, I, O, U)?
SIMON_WITH_VOWEL=Numéro de Série AVEC Voyelle
SIMON_WITHOUT_VOWEL=Numéro de Série SANS Voyelle
SIMON_FLASH=Éclair
SIMON_0_STRIKES=0 Erreur
SIMON_1_STRIKE=1 Erreur
SIMON_2_STRIKES=2+ Erreurs
SIMON_COMPLETE=<b>Complétez 3 étapes</b> pour résoudre le module. Chaque étape ajoute une couleur supplémentaire à mémoriser.

# ===== MODULE LABYRINTHE =====
MAZE_DESC1=Naviguez le <b>triangle blanc</b> (vous) vers le <b>cercle rouge</b> (cible).
MAZE_DESC2=Utilisez <span class='highlight'>ZQSD</span> ou les <span class='highlight'>Touches Directionnelles</span> pour vous déplacer.
MAZE_WALLS=<b>Les murs sont visibles</b> comme des blocs vert foncé. Heurter un mur cause une ERREUR!
MAZE_BUTTONS=Vous pouvez aussi cliquer sur les boutons directionnels sous le labyrinthe.

# ===== MODULE MÉMOIRE =====
MEMORY_DESC=Un test de mémoire en 5 étapes. Mémorisez les positions ET les étiquettes des étapes précédentes.
MEMORY_STAGE=Étape
MEMORY_DISPLAY=Affichage
MEMORY_ACTION=Action
MEMORY_STAGE_1=Étape 1
MEMORY_STAGE_2=Étape 2
MEMORY_STAGE_3=Étape 3
MEMORY_STAGE_4=Étape 4
MEMORY_STAGE_5=Étape 5
MEMORY_PRESS_POS=Appuyez Position
MEMORY_PRESS_LABEL=Appuyez Étiquette
MEMORY_SAME_POS_AS=Même Position que Étape
MEMORY_SAME_LABEL_AS=Même Étiquette que Étape

# ===== MODULE CODE MORSE =====
MORSE_DESC=Observez la lumière clignotante et décodez le mot en code Morse. Utilisez les boutons < et > pour régler la fréquence, puis appuyez sur TX.
MORSE_WORD=Mot
MORSE_FREQUENCY=Fréquence

# ===== MODULE FILS COMPLEXES =====
COMPWIRES_DESC=Chaque fil peut avoir: une couleur <b>Rouge</b>, une couleur <b>Bleue</b>, un symbole <b>★ Étoile</b>, et une <b>LED</b> allumée.
COMPWIRES_TABLE_INFO=Utilisez ce tableau - X signifie que la caractéristique est présente:
COMPWIRES_RED=Rouge
COMPWIRES_BLUE=Bleu
COMPWIRES_STAR=Étoile
COMPWIRES_LED=LED
COMPWIRES_ACTION=Action
COMPWIRES_CUT=COUPER
COMPWIRES_DONT_CUT=Ne Pas Couper
COMPWIRES_CUT_IF_PARALLEL=Couper si Port Parallèle
COMPWIRES_CUT_IF_EVEN=Couper si N° Série finit Pair
COMPWIRES_CUT_IF_BATTERIES=Couper si Piles ≥ 2
COMPWIRES_FINAL=<b>Coupez tous les fils qui doivent être coupés</b> pour désamorcer le module.

# ===== MODULE MOT DE PASSE =====
PASSWORD_DESC=Utilisez les flèches ▲ et ▼ pour faire défiler les lettres. Trouvez et soumettez le mot de 5 lettres.
PASSWORD_POSSIBLE=<b>Mots de passe possibles:</b>
PASSWORD_LIST=ABOUT, AFTER, AGAIN, BELOW, COULD, EVERY, FIRST, FOUND, GREAT, HOUSE, LARGE, LEARN, NEVER, OTHER, PLACE, PLANT, POINT, RIGHT, SMALL, SOUND, SPELL, STILL, STUDY, THEIR, THERE, THESE, THING, THINK, THREE, WATER, WHERE, WHICH, WORLD, WOULD, WRITE

# ===== MODULE QUI EST PREMIER =====
WHOSONFIRST_STEP1=<b>Étape 1:</b> Lisez le mot AFFICHÉ, trouvez quelle POSITION de bouton regarder:
WHOSONFIRST_DISPLAY=Affichage
WHOSONFIRST_LOOK_AT=Regarder
WHOSONFIRST_STEP2=<b>Étape 2:</b> Lisez l'ÉTIQUETTE de ce bouton. Trouvez-la dans les listes ci-dessous. Appuyez sur le premier mot de la liste qui apparaît sur un bouton:
WHOSONFIRST_COMPLETE=<b>Complétez 3 étapes</b> pour résoudre.
WHOSONFIRST_TOP_LEFT=Haut-Gauche
WHOSONFIRST_TOP_RIGHT=Haut-Droite
WHOSONFIRST_MIDDLE_LEFT=Milieu-Gauche
WHOSONFIRST_MIDDLE_RIGHT=Milieu-Droite
WHOSONFIRST_BOTTOM_LEFT=Bas-Gauche
WHOSONFIRST_BOTTOM_RIGHT=Bas-Droite
WHOSONFIRST_EMPTY=(vide)

# ===== MODULE BINAIRE =====
BINARY_DESC=Convertissez le nombre décimal affiché en binaire sur 5 bits.
BINARY_SWITCHES=Les interrupteurs représentent (de gauche à droite): <span class='highlight'>16, 8, 4, 2, 1</span>
BINARY_EXAMPLE=<b>Exemple:</b> Nombre 21 = 16 + 4 + 1 = interrupteurs ON pour 16, 4, et 1 = <b>10101</b>
BINARY_DECIMAL=Décimal
BINARY_BINARY=Binaire

# ===== MODULE PORTES LOGIQUES =====
LOGIC_DESC=Complétez 3 étapes. Chaque étape montre deux entrées (A et B) et une porte logique. Réglez la SORTIE correctement.
LOGIC_GATE=Porte
LOGIC_CLICK_OUTPUT=Cliquez sur le cercle SORTIE pour basculer ON/OFF, puis appuyez sur VÉRIFIER.

