# ===== WIRES MODULE =====
WIRES_DESC=Wires are arranged horizontally. Cut the correct wire to defuse.
WIRES_RULE=Always cut the last wire.
WIRES_NOTE=<b>Note:</b> The module displays 3 to 6 colored wires. Count from top (1) to bottom (6). The correct wire to cut is always the last one in the sequence.

# ===== BUTTON MODULE =====
BTN_STEP1=Step 1: Determine whether to Tap or Hold
BTN_STEP2=Step 2: Releasing a Held Button
BTN_FOLLOW_RULES=Follow these rules <b>in order</b>. Stop at the first rule that applies:
BTN_BLUE_ABORT=If the button is <b>Blue</b> and says <b>Abort</b>, <span class='highlight'>Hold</span> it.
BTN_DETONATE=If there is more than 1 battery and the button says <b>Detonate</b>, <span class='highlight'>Tap</span> it.
BTN_WHITE_CAR=If the button is <b>White</b> and there is a lit indicator <b>CAR</b>, <span class='highlight'>Hold</span> it.
BTN_FRK=If there are more than 2 batteries and a lit indicator <b>FRK</b>, <span class='highlight'>Tap</span> it.
BTN_YELLOW=If the button is <b>Yellow</b>, <span class='highlight'>Hold</span> it.
BTN_RED_HOLD=If the button is <b>Red</b> and says <b>Hold</b>, <span class='highlight'>Tap</span> it.
BTN_OTHERWISE=Otherwise, <span class='highlight'>Hold</span> it.
BTN_STRIP_INFO=If you hold the button, a colored strip will light up. Release the button when the timer contains the corresponding digit:
BTN_STRIP_BLUE=Blue Strip:
BTN_STRIP_WHITE=White Strip:
BTN_STRIP_YELLOW=Yellow Strip:
BTN_STRIP_OTHER=Any other color:
BTN_STRIP_HEADER_COLOR=Strip Color
BTN_STRIP_HEADER_RELEASE=Release when timer contains:

# ===== KEYPAD MODULE =====
KEYPAD_DESC=The keypad displays 4 symbols. Press them in <span class='highlight'>alphabetical order</span> based on their Unicode character values.
KEYPAD_TIP=<b>Tip:</b> Compare the symbols visually - Greek letters (\u03A9, \u03A8, \u03A6) come before Cyrillic letters, which come before special symbols.

# ===== SIMON SAYS MODULE =====
SIMON_DESC=Watch the colored lights flash. Press buttons in the correct order based on the serial number and current strikes.
SIMON_SERIAL_CHECK=<b>Check the SERIAL NUMBER:</b> Does it contain a vowel (A, E, I, O, U)?
SIMON_WITH_VOWEL=Serial Number WITH Vowel
SIMON_WITHOUT_VOWEL=Serial Number WITHOUT Vowel
SIMON_FLASH=Flash
SIMON_0_STRIKES=0 Strikes
SIMON_1_STRIKE=1 Strike
SIMON_2_STRIKES=2+ Strikes
SIMON_COMPLETE=<b>Complete 3 stages</b> to solve the module. Each stage adds one more color to remember.

# ===== MAZE MODULE =====
MAZE_DESC1=Navigate the <b>white triangle</b> (you) to the <b>red circle</b> (target).
MAZE_DESC2=Use <span class='highlight'>WASD</span> or <span class='highlight'>Arrow Keys</span> to move.
MAZE_WALLS=<b>Walls are visible</b> as dark green blocks. Moving into a wall causes a STRIKE!
MAZE_BUTTONS=You can also click the directional buttons below the maze.

