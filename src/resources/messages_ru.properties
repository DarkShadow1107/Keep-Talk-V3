KEYPAD_TIP=<b>Совет:</b> Сравнивайте символы визуально - греческие буквы (Ω, Ψ, Φ) идут перед кириллическими, которые идут перед специальными символами.

# ===== МОДУЛЬ САЙМОН ГОВОРИТ =====
SIMON_DESC=Наблюдайте за мигающими цветными огнями. Нажимайте кнопки в правильном порядке на основе серийного номера и текущих ошибок.
