# ===== МОДУЛЬ ПРОВОДА =====
WIRES_DESC=Провода расположены горизонтально. Перережьте правильный провод для обезвреживания.
WIRES_RULE=Всегда перерезайте последний провод.
WIRES_NOTE=<b>Примечание:</b> Модуль показывает от 3 до 6 цветных проводов. Считайте сверху (1) вниз (6). Правильный провод для перерезания всегда последний в последовательности.

# ===== МОДУЛЬ КНОПКА =====
BTN_STEP1=Шаг 1: Определите, нажимать или удерживать
BTN_STEP2=Шаг 2: Отпускание удерживаемой кнопки
BTN_FOLLOW_RULES=Следуйте этим правилам <b>по порядку</b>. Остановитесь на первом применимом правиле:
BTN_BLUE_ABORT=Если кнопка <b>Синяя</b> и говорит <b>Отмена</b>, <span class='highlight'>Удерживайте</span> её.
BTN_DETONATE=Если больше 1 батареи и кнопка говорит <b>Взорвать</b>, <span class='highlight'>Нажмите</span> её.
BTN_WHITE_CAR=Если кнопка <b>Белая</b> и есть горящий индикатор <b>CAR</b>, <span class='highlight'>Удерживайте</span> её.
BTN_FRK=Если более 2 батарей и горящий индикатор <b>FRK</b>, <span class='highlight'>Нажмите</span> её.
BTN_YELLOW=Если кнопка <b>Жёлтая</b>, <span class='highlight'>Удерживайте</span> её.
BTN_RED_HOLD=Если кнопка <b>Красная</b> и говорит <b>Удерживать</b>, <span class='highlight'>Нажмите</span> её.
BTN_OTHERWISE=В противном случае, <span class='highlight'>Удерживайте</span> её.
BTN_STRIP_INFO=Если вы удерживаете кнопку, загорится цветная полоса. Отпустите кнопку, когда таймер содержит соответствующую цифру:
BTN_STRIP_BLUE=Синяя Полоса:
BTN_STRIP_WHITE=Белая Полоса:
BTN_STRIP_YELLOW=Жёлтая Полоса:
BTN_STRIP_OTHER=Любой другой цвет:
BTN_STRIP_HEADER_COLOR=Цвет Полосы
BTN_STRIP_HEADER_RELEASE=Отпустить когда таймер содержит:

