SIMON_WITHOUT_VOWEL=Серийный Номер БЕЗ Гласной
SIMON_FLASH=Вспышка
SIMON_0_STRIKES=0 Ошибок
SIMON_1_STRIKE=1 Ошибка
SIMON_2_STRIKES=2+ Ошибки
SIMON_COMPLETE=<b>Пройдите 3 этапа</b> для решения модуля. Каждый этап добавляет ещё один цвет для запоминания.

