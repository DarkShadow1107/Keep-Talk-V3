# ===== DRADEN MODULE =====
WIRES_DESC=Draden zijn horizontaal gerangschikt. Knip de juiste draad om te ontmantelen.
WIRES_RULE=Knip altijd de laatste draad.
WIRES_NOTE=<b>Opmerking:</b> De module toont 3 tot 6 gekleurde draden. Tel van boven (1) naar beneden (6). De juiste draad om te knippen is altijd de laatste in de reeks.

# ===== KNOP MODULE =====
BTN_STEP1=Stap 1: Bepaal of je moet Tikken of Vasthouden
BTN_STEP2=Stap 2: Een Vastgehouden Knop Loslaten
BTN_FOLLOW_RULES=Volg deze regels <b>op volgorde</b>. Stop bij de eerste regel die van toepassing is:
BTN_BLUE_ABORT=Als de knop <b>Blauw</b> is en <b>Afbreken</b> zegt, <span class='highlight'>Houd</span> hem vast.
BTN_DETONATE=Als er meer dan 1 batterij is en de knop zegt <b>Ontploffen</b>, <span class='highlight'>Tik</span> erop.
BTN_WHITE_CAR=Als de knop <b>Wit</b> is en er is een verlichte indicator <b>CAR</b>, <span class='highlight'>Houd</span> hem vast.
BTN_FRK=Als er meer dan 2 batterijen zijn en een verlichte indicator <b>FRK</b>, <span class='highlight'>Tik</span> erop.
BTN_YELLOW=Als de knop <b>Geel</b> is, <span class='highlight'>Houd</span> hem vast.
BTN_RED_HOLD=Als de knop <b>Rood</b> is en <b>Vasthouden</b> zegt, <span class='highlight'>Tik</span> erop.
BTN_OTHERWISE=Anders, <span class='highlight'>Houd</span> hem vast.
BTN_STRIP_INFO=Als je de knop vasthoudt, zal een gekleurde strip oplichten. Laat de knop los wanneer de timer het corresponderende cijfer bevat:
BTN_STRIP_BLUE=Blauwe Strip:
BTN_STRIP_WHITE=Witte Strip:
BTN_STRIP_YELLOW=Gele Strip:
BTN_STRIP_OTHER=Elke andere kleur:
BTN_STRIP_HEADER_COLOR=Stripkleur
BTN_STRIP_HEADER_RELEASE=Loslaten wanneer timer bevat:

# ===== TOETSENBORD MODULE =====
KEYPAD_DESC=Het toetsenbord toont 4 symbolen. Druk ze in <span class='highlight'>alfabetische volgorde</span> gebaseerd op hun Unicode-tekenwaarden.
KEYPAD_TIP=<b>Tip:</b> Vergelijk de symbolen visueel - Griekse letters (Ω, Ψ, Φ) komen voor Cyrillische letters, die voor speciale symbolen komen.

# ===== SIMON ZEGT MODULE =====
SIMON_DESC=Kijk naar de gekleurde lichten die knipperen. Druk op de knoppen in de juiste volgorde gebaseerd op het serienummer en huidige fouten.
SIMON_SERIAL_CHECK=<b>Controleer het SERIENUMMER:</b> Bevat het een klinker (A, E, I, O, U)?
SIMON_WITH_VOWEL=Serienummer MET Klinker
SIMON_WITHOUT_VOWEL=Serienummer ZONDER Klinker
SIMON_FLASH=Flits
SIMON_0_STRIKES=0 Fouten
SIMON_1_STRIKE=1 Fout
SIMON_2_STRIKES=2+ Fouten
SIMON_COMPLETE=<b>Voltooi 3 fasen</b> om de module op te lossen. Elke fase voegt nog een kleur toe om te onthouden.

# ===== DOOLHOF MODULE =====
MAZE_DESC1=Navigeer de <b>witte driehoek</b> (jij) naar de <b>rode cirkel</b> (doel).
MAZE_DESC2=Gebruik <span class='highlight'>WASD</span> of de <span class='highlight'>Pijltjestoetsen</span> om te bewegen.
MAZE_WALLS=<b>Muren zijn zichtbaar</b> als donkergroene blokken. Tegen een muur bewegen veroorzaakt een FOUT!
MAZE_BUTTONS=Je kunt ook klikken op de richtingsknoppen onder het doolhof.

