SIMON_WITHOUT_VOWEL=Serienummer UDEN Vokal
SIMON_FLASH=Blink
SIMON_0_STRIKES=0 Fejl
SIMON_1_STRIKE=1 Fejl
SIMON_2_STRIKES=2+ Fejl
SIMON_COMPLETE=<b>Gennemfør 3 faser</b> for at løse modulet. Hver fase tilføjer én farve mere at huske.

# ===== LABYRINT MODUL =====
