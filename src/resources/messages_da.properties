# ===== LEDNINGER MODUL =====
WIRES_DESC=Ledninger er arrangeret vandret. Klip den rigtige ledning for at desarmere.
WIRES_RULE=Klip altid den sidste ledning.
WIRES_NOTE=<b>Bemærk:</b> Modulet viser 3 til 6 farvede ledninger. Tæl fra toppen (1) til bunden (6). Den korrekte ledning at klippe er altid den sidste i sekvensen.

# ===== KNAP MODUL =====
BTN_STEP1=Trin 1: Bestem om du skal Trykke eller Holde
BTN_STEP2=Trin 2: Slip en Holdt Knap
BTN_FOLLOW_RULES=Følg disse regler <b>i rækkefølge</b>. Stop ved den første regel der passer:
BTN_BLUE_ABORT=Hvis knappen er <b>Blå</b> og siger <b>Afbryd</b>, <span class='highlight'>Hold</span> den.
BTN_DETONATE=Hvis der er mere end 1 batteri og knappen siger <b>Detoner</b>, <span class='highlight'>Tryk</span> på den.
BTN_WHITE_CAR=Hvis knappen er <b>Hvid</b> og der er en tændt indikator <b>CAR</b>, <span class='highlight'>Hold</span> den.
BTN_FRK=Hvis der er mere end 2 batterier og en tændt indikator <b>FRK</b>, <span class='highlight'>Tryk</span> på den.
BTN_YELLOW=Hvis knappen er <b>Gul</b>, <span class='highlight'>Hold</span> den.
BTN_RED_HOLD=Hvis knappen er <b>Rød</b> og siger <b>Hold</b>, <span class='highlight'>Tryk</span> på den.
BTN_OTHERWISE=Ellers, <span class='highlight'>Hold</span> den.
BTN_STRIP_INFO=Hvis du holder knappen, vil en farvet stribe lyse op. Slip knappen når timeren indeholder det tilsvarende ciffer:
BTN_STRIP_BLUE=Blå Stribe:
BTN_STRIP_WHITE=Hvid Stribe:
BTN_STRIP_YELLOW=Gul Stribe:
BTN_STRIP_OTHER=Enhver anden farve:
BTN_STRIP_HEADER_COLOR=Stribefarve
BTN_STRIP_HEADER_RELEASE=Slip når timeren indeholder:

# ===== TASTATUR MODUL =====
KEYPAD_DESC=Tastaturet viser 4 symboler. Tryk på dem i <span class='highlight'>alfabetisk rækkefølge</span> baseret på deres Unicode-tegnværdier.
KEYPAD_TIP=<b>Tip:</b> Sammenlign symbolerne visuelt - græske bogstaver (Ω, Ψ, Φ) kommer før kyrilliske bogstaver, som kommer før specialsymboler.

# ===== SIMON SIGER MODUL =====
SIMON_DESC=Se de farvede lys blinke. Tryk på knapperne i den rigtige rækkefølge baseret på serienummeret og aktuelle fejl.
