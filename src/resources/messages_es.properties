# ===== MÓDULO CABLES =====
WIRES_DESC=Los cables están dispuestos horizontalmente. Corta el cable correcto para desactivar.
WIRES_RULE=Siempre corta el último cable.
WIRES_NOTE=<b>Nota:</b> El módulo muestra de 3 a 6 cables de colores. Cuenta desde arriba (1) hasta abajo (6). El cable correcto para cortar es siempre el último de la secuencia.

# ===== MÓDULO BOTÓN =====
BTN_STEP1=Paso 1: Determinar si Tocar o Mantener
BTN_STEP2=Paso 2: Soltar un Botón Mantenido
BTN_FOLLOW_RULES=Sigue estas reglas <b>en orden</b>. Detente en la primera regla que aplique:
BTN_BLUE_ABORT=Si el botón es <b>Azul</b> y dice <b>Abortar</b>, <span class='highlight'>Manténlo</span>.
BTN_DETONATE=Si hay más de 1 batería y el botón dice <b>Detonar</b>, <span class='highlight'>Tócalo</span>.
BTN_WHITE_CAR=Si el botón es <b>Blanco</b> y hay un indicador encendido <b>CAR</b>, <span class='highlight'>Manténlo</span>.
BTN_FRK=Si hay más de 2 baterías y un indicador encendido <b>FRK</b>, <span class='highlight'>Tócalo</span>.
BTN_YELLOW=Si el botón es <b>Amarillo</b>, <span class='highlight'>Manténlo</span>.
BTN_RED_HOLD=Si el botón es <b>Rojo</b> y dice <b>Mantener</b>, <span class='highlight'>Tócalo</span>.
BTN_OTHERWISE=De lo contrario, <span class='highlight'>Manténlo</span>.
BTN_STRIP_INFO=Si mantienes el botón, se encenderá una tira de color. Suelta el botón cuando el temporizador contenga el dígito correspondiente:
BTN_STRIP_BLUE=Tira Azul:
BTN_STRIP_WHITE=Tira Blanca:
BTN_STRIP_YELLOW=Tira Amarilla:
BTN_STRIP_OTHER=Cualquier otro color:
BTN_STRIP_HEADER_COLOR=Color de Tira
BTN_STRIP_HEADER_RELEASE=Soltar cuando el temporizador contenga:

# ===== MÓDULO TECLADO =====
KEYPAD_DESC=El teclado muestra 4 símbolos. Presiónalos en <span class='highlight'>orden alfabético</span> basado en sus valores Unicode.
KEYPAD_TIP=<b>Consejo:</b> Compara los símbolos visualmente - las letras griegas (Ω, Ψ, Φ) vienen antes de las cirílicas, que vienen antes de los símbolos especiales.

# ===== MÓDULO SIMÓN DICE =====
SIMON_DESC=Observa las luces de colores parpadear. Presiona los botones en el orden correcto basado en el número de serie y los fallos actuales.
SIMON_SERIAL_CHECK=<b>Verifica el NÚMERO DE SERIE:</b> ¿Contiene una vocal (A, E, I, O, U)?
SIMON_WITH_VOWEL=Número de Serie CON Vocal
SIMON_WITHOUT_VOWEL=Número de Serie SIN Vocal
SIMON_FLASH=Destello
SIMON_0_STRIKES=0 Fallos
SIMON_1_STRIKE=1 Fallo
SIMON_2_STRIKES=2+ Fallos
SIMON_COMPLETE=<b>Completa 3 etapas</b> para resolver el módulo. Cada etapa añade un color más para recordar.

# ===== MÓDULO LABERINTO =====
MAZE_DESC1=Navega el <b>triángulo blanco</b> (tú) hacia el <b>círculo rojo</b> (objetivo).
MAZE_DESC2=Usa <span class='highlight'>WASD</span> o las <span class='highlight'>Teclas de Flecha</span> para moverte.
MAZE_WALLS=<b>Los muros son visibles</b> como bloques verde oscuro. ¡Chocar contra un muro causa un FALLO!
MAZE_BUTTONS=También puedes hacer clic en los botones direccionales debajo del laberinto.

# ===== MÓDULO MEMORIA =====
MEMORY_DESC=Una prueba de memoria de 5 etapas. Recuerda las posiciones Y las etiquetas de las etapas anteriores.
MEMORY_STAGE=Etapa
MEMORY_DISPLAY=Pantalla
MEMORY_ACTION=Acción
MEMORY_STAGE_1=Etapa 1
MEMORY_STAGE_2=Etapa 2
MEMORY_STAGE_3=Etapa 3
MEMORY_STAGE_4=Etapa 4
MEMORY_STAGE_5=Etapa 5
MEMORY_PRESS_POS=Presiona Posición
MEMORY_PRESS_LABEL=Presiona Etiqueta
MEMORY_SAME_POS_AS=Misma Posición que Etapa
MEMORY_SAME_LABEL_AS=Misma Etiqueta que Etapa

# ===== MÓDULO CÓDIGO MORSE =====
MORSE_DESC=Observa la luz parpadeante y decodifica la palabra en código Morse. Usa los botones < y > para sintonizar la frecuencia correcta, luego presiona TX.
MORSE_WORD=Palabra
MORSE_FREQUENCY=Frecuencia

# ===== MÓDULO CABLES COMPLICADOS =====
COMPWIRES_DESC=Cada cable puede tener: color <b>Rojo</b>, color <b>Azul</b>, un símbolo <b>★ Estrella</b>, y una <b>LED</b> encendida.
COMPWIRES_TABLE_INFO=Usa esta tabla - X significa que la característica está presente:
COMPWIRES_RED=Rojo
COMPWIRES_BLUE=Azul
COMPWIRES_STAR=Estrella
COMPWIRES_LED=LED
COMPWIRES_ACTION=Acción
COMPWIRES_CUT=CORTAR
COMPWIRES_DONT_CUT=No Cortar
COMPWIRES_CUT_IF_PARALLEL=Cortar si Puerto Paralelo
COMPWIRES_CUT_IF_EVEN=Cortar si N° Serie termina Par
COMPWIRES_CUT_IF_BATTERIES=Cortar si Baterías ≥ 2
COMPWIRES_FINAL=<b>Corta todos los cables que deben cortarse</b> para desactivar el módulo.

# ===== MÓDULO CONTRASEÑA =====
PASSWORD_DESC=Usa las flechas ▲ y ▼ para desplazarte por las letras de cada columna. Encuentra y envía la palabra de 5 letras.
PASSWORD_POSSIBLE=<b>Contraseñas posibles:</b>
PASSWORD_LIST=ABOUT, AFTER, AGAIN, BELOW, COULD, EVERY, FIRST, FOUND, GREAT, HOUSE, LARGE, LEARN, NEVER, OTHER, PLACE, PLANT, POINT, RIGHT, SMALL, SOUND, SPELL, STILL, STUDY, THEIR, THERE, THESE, THING, THINK, THREE, WATER, WHERE, WHICH, WORLD, WOULD, WRITE

# ===== MÓDULO ¿QUIÉN ES PRIMERO? =====
WHOSONFIRST_STEP1=<b>Paso 1:</b> Lee la palabra MOSTRADA, encuentra qué POSICIÓN de botón mirar:
WHOSONFIRST_DISPLAY=Pantalla
WHOSONFIRST_LOOK_AT=Mirar
WHOSONFIRST_STEP2=<b>Paso 2:</b> Lee la ETIQUETA de ese botón. Encuéntrala en las listas abajo. Presiona la primera palabra de la lista que aparezca en cualquier botón:
WHOSONFIRST_COMPLETE=<b>Completa 3 etapas</b> para resolver.
WHOSONFIRST_TOP_LEFT=Arriba-Izquierda
WHOSONFIRST_TOP_RIGHT=Arriba-Derecha
WHOSONFIRST_MIDDLE_LEFT=Centro-Izquierda
WHOSONFIRST_MIDDLE_RIGHT=Centro-Derecha
WHOSONFIRST_BOTTOM_LEFT=Abajo-Izquierda
WHOSONFIRST_BOTTOM_RIGHT=Abajo-Derecha
WHOSONFIRST_EMPTY=(vacío)

# ===== MÓDULO BINARIO =====
BINARY_DESC=Convierte el número decimal mostrado a binario de 5 bits.
BINARY_SWITCHES=Los interruptores representan (de izquierda a derecha): <span class='highlight'>16, 8, 4, 2, 1</span>
BINARY_EXAMPLE=<b>Ejemplo:</b> Número 21 = 16 + 4 + 1 = interruptores ON para 16, 4, y 1 = <b>10101</b>
BINARY_DECIMAL=Decimal
BINARY_BINARY=Binario

# ===== MÓDULO PUERTAS LÓGICAS =====
LOGIC_DESC=Completa 3 etapas. Cada etapa muestra dos entradas (A y B) y una puerta lógica. Configura la SALIDA correctamente.
LOGIC_GATE=Puerta
LOGIC_CLICK_OUTPUT=Haz clic en el círculo SALIDA para alternar ON/OFF, luego presiona VERIFICAR.

