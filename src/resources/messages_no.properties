SIMON_WITH_VOWEL=Serienummer MED Vokal
SIMON_WITHOUT_VOWEL=Serienummer UTEN Vokal
SIMON_FLASH=Blink
SIMON_0_STRIKES=0 Feil
SIMON_1_STRIKE=1 Feil
SIMON_2_STRIKES=2+ Feil
SIMON_COMPLETE=<b>Fullfør 3 faser</b> for å løse modulen. Hver fase legger til én farge å huske.

# ===== LABYRINT MODUL =====
