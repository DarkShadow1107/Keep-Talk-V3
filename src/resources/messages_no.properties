# ===== LEDNINGER MODUL =====
WIRES_DESC=Ledninger er ordnet horisontalt. Klipp riktig ledning for å desarmere.
WIRES_RULE=Klipp alltid den siste ledningen.
WIRES_NOTE=<b>Merk:</b> Modulen viser 3 til 6 fargede ledninger. Tell fra toppen (1) til bunnen (6). Riktig ledning å klippe er alltid den siste i sekvensen.

# ===== KNAPP MODUL =====
BTN_STEP1=Trinn 1: Bestem om du skal Trykke eller Holde
BTN_STEP2=Trinn 2: Slippe en Holdt Knapp
BTN_FOLLOW_RULES=Følg disse reglene <b>i rekkefølge</b>. Stopp ved den første regelen som gjelder:
BTN_BLUE_ABORT=Hvis knappen er <b>Blå</b> og sier <b>Avbryt</b>, <span class='highlight'>Hold</span> den.
BTN_DETONATE=Hvis det er mer enn 1 batteri og knappen sier <b>Detoner</b>, <span class='highlight'>Trykk</span> på den.
BTN_WHITE_CAR=Hvis knappen er <b>Hvit</b> og det er en tent indikator <b>CAR</b>, <span class='highlight'>Hold</span> den.
BTN_FRK=Hvis det er mer enn 2 batterier og en tent indikator <b>FRK</b>, <span class='highlight'>Trykk</span> på den.
BTN_YELLOW=Hvis knappen er <b>Gul</b>, <span class='highlight'>Hold</span> den.
BTN_RED_HOLD=Hvis knappen er <b>Rød</b> og sier <b>Hold</b>, <span class='highlight'>Trykk</span> på den.
BTN_OTHERWISE=Ellers, <span class='highlight'>Hold</span> den.
BTN_STRIP_INFO=Hvis du holder knappen, vil en farget stripe lyse opp. Slipp knappen når timeren inneholder det tilsvarende sifferet:
BTN_STRIP_BLUE=Blå Stripe:
BTN_STRIP_WHITE=Hvit Stripe:
BTN_STRIP_YELLOW=Gul Stripe:
BTN_STRIP_OTHER=Hvilken som helst annen farge:
BTN_STRIP_HEADER_COLOR=Stripefarge
BTN_STRIP_HEADER_RELEASE=Slipp når timeren inneholder:

# ===== TASTATUR MODUL =====
KEYPAD_DESC=Tastaturet viser 4 symboler. Trykk dem i <span class='highlight'>alfabetisk rekkefølge</span> basert på deres Unicode-tegnverdier.
KEYPAD_TIP=<b>Tips:</b> Sammenlign symbolene visuelt - greske bokstaver (Ω, Ψ, Φ) kommer før kyrilliske bokstaver, som kommer før spesialsymboler.

# ===== SIMON SIER MODUL =====
SIMON_DESC=Se de fargede lysene blinke. Trykk knappene i riktig rekkefølge basert på serienummeret og nåværende feil.
